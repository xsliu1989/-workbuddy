<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>绿益公益 · 管理后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6f9; color: #1f2937; font-size: 14px; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  /* ============ 登录页 ============ */
  #loginView { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f766e 0%, #115e59 50%, #134e4a 100%); }
  .login-card { width: 380px; background: #fff; border-radius: 16px; padding: 40px 36px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .login-logo { width: 56px; height: 56px; border-radius: 14px; background: #0f766e; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 18px; }
  .login-title { text-align: center; font-size: 21px; font-weight: 700; color: #111827; }
  .login-sub { text-align: center; color: #6b7280; margin: 6px 0 28px; font-size: 13px; }
  .form-label { display: block; font-size: 13px; color: #374151; margin: 16px 0 6px; font-weight: 600; }
  .form-input { width: 100%; height: 42px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 12px; font-size: 14px; outline: none; transition: border .2s; }
  .form-input:focus { border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15,118,110,.12); }
  .login-btn { width: 100%; height: 44px; margin-top: 26px; border: none; border-radius: 8px; background: #0f766e; color: #fff; font-size: 15px; font-weight: 600; transition: background .2s; }
  .login-btn:hover { background: #115e59; }
  .login-btn:disabled { background: #9ca3af; cursor: not-allowed; }
  .login-tip { margin-top: 18px; padding: 10px 12px; background: #f0fdfa; border-radius: 8px; color: #0f766e; font-size: 12px; line-height: 1.7; }
  .login-err { margin-top: 14px; color: #dc2626; font-size: 13px; min-height: 18px; text-align: center; }

  /* ============ 主框架 ============ */
  #mainView { display: none; min-height: 100vh; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #0f172a; color: #cbd5e1; padding: 20px 0; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 22px 22px; border-bottom: 1px solid #1e293b; margin-bottom: 12px; }
  .brand-icon { width: 34px; height: 34px; border-radius: 9px; background: #0f766e; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
  .brand-name { font-size: 15px; font-weight: 700; color: #f8fafc; }
  .brand-sub { font-size: 11px; color: #64748b; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 22px; font-size: 14px; cursor: pointer; transition: background .15s, color .15s; }
  .nav-item:hover { background: #1e293b; color: #fff; }
  .nav-item.active { background: #0f766e; color: #fff; font-weight: 600; }
  .nav-icon { width: 18px; text-align: center; font-size: 15px; }
  .nav-group { padding: 16px 22px 6px; font-size: 11px; color: #475569; letter-spacing: 1px; }

  .main { margin-left: 220px; min-height: 100vh; }
  .topbar { height: 60px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; position: sticky; top: 0; z-index: 5; }
  .topbar-title { font-size: 16px; font-weight: 600; color: #111827; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .user-badge { display: flex; align-items: center; gap: 8px; color: #374151; font-size: 13px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #ccfbf1; color: #0f766e; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .role-tag { background: #f0fdfa; color: #0f766e; border: 1px solid #99f6e4; border-radius: 4px; padding: 2px 7px; font-size: 11px; }
  .logout-btn { border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 6px 12px; color: #6b7280; font-size: 13px; }
  .logout-btn:hover { background: #f9fafb; color: #111827; }

  .content { padding: 26px 28px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .page-title { font-size: 20px; font-weight: 700; color: #111827; }
  .page-desc { color: #6b7280; font-size: 13px; margin-top: 4px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; }
  .stat-label { color: #6b7280; font-size: 13px; }
  .stat-value { font-size: 30px; font-weight: 700; color: #0f766e; margin-top: 8px; }
  .stat-note { color: #9ca3af; font-size: 11px; margin-top: 6px; }

  .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
  .panel-head { padding: 15px 20px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; }
  .panel-title { font-weight: 600; color: #111827; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f9fafb; color: #6b7280; font-size: 12px; font-weight: 600; text-align: left; padding: 11px 16px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; font-size: 13px; color: #374151; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: #f3f4f6; color: #6b7280; }
  .tag-green { background: #dcfce7; color: #166534; }
  .tag-amber { background: #fef3c7; color: #92400e; }
  .tag-red { background: #fee2e2; color: #991b1b; }
  .tag-blue { background: #dbeafe; color: #1e40af; }

  .btn { border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 5px 11px; font-size: 12px; color: #374151; margin-right: 6px; }
  .btn:hover { background: #f3f4f6; }
  .btn-primary { border-color: #0f766e; background: #0f766e; color: #fff; }
  .btn-primary:hover { background: #115e59; }
  .btn-danger { border-color: #fecaca; color: #dc2626; }
  .btn-danger:hover { background: #fef2f2; }

  /* 图片上传控件 */
  .upload-field { margin: 4px 0 8px; }
  .upload-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .upload-thumb { position: relative; width: 84px; height: 84px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: #f9fafb; }
  .upload-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .upload-remove { position: absolute; top: 2px; right: 4px; width: 20px; height: 20px; line-height: 18px; text-align: center; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; cursor: pointer; }
  .upload-btn { display: inline-block; cursor: pointer; margin-top: 4px; }

  .empty { padding: 50px 20px; text-align: center; color: #9ca3af; }
  .empty-icon { font-size: 38px; margin-bottom: 10px; opacity: .5; }
  .loading { padding: 50px; text-align: center; color: #6b7280; }
  .pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 18px; color: #6b7280; font-size: 13px; }
  .pager button { border: 1px solid #d1d5db; background: #fff; border-radius: 5px; padding: 4px 10px; color: #374151; }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }

  /* ============ 弹窗 / 提示 ============ */
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 50; align-items: center; justify-content: center; }
  .modal { width: 420px; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #111827; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .modal-foot .btn { margin-right: 0; padding: 8px 16px; font-size: 13px; }
  .toast { position: fixed; top: 74px; right: 28px; padding: 12px 18px; border-radius: 8px; color: #fff; font-size: 13px; z-index: 100; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 420px; }
  .toast.show { opacity: 1; }
  .toast.ok { background: #0f766e; }
  .toast.err { background: #dc2626; }
  .json-pre { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; color: #334155; }
</style>
</head>
<body>

<!-- ================= 登录页 ================= -->
<div id="loginView">
  <div class="login-card">
    <div class="login-logo">绿</div>
    <div class="login-title">绿益公益 · 管理后台</div>
    <div class="login-sub">GreenYi Charity Admin Console</div>
    <label class="form-label">用户名</label>
    <input id="loginUser" class="form-input" value="admin" autocomplete="username" placeholder="请输入用户名">
    <label class="form-label">密码</label>
    <input id="loginPass" class="form-input" type="password" value="admin123" autocomplete="current-password" placeholder="请输入密码">
    <button id="loginBtn" class="login-btn">登 录</button>
    <div id="loginErr" class="login-err"></div>
    <div class="login-tip">
      <b>演示账号</b>：admin / admin123（系统管理员）<br>
      或 assessor / assess123（物资评估员）<br>
      <span style="color:#6b7280">账号来自 schema.sql，生产环境请务必修改默认密码。</span>
    </div>
  </div>
</div>

<!-- ================= 主界面 ================= -->
<div id="mainView">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">绿</div>
      <div><div class="brand-name">绿益公益</div><div class="brand-sub">管理后台</div></div>
    </div>
    <div class="nav-group">工作台</div>
    <div class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span> 数据看板</div>
    <div class="nav-group">业务管理</div>
    <div class="nav-item" data-page="contents"><span class="nav-icon">▤</span> 内容管理</div>
    <div class="nav-item" data-page="products"><span class="nav-icon">▣</span> 商品管理</div>
    <div class="nav-item" data-page="activities"><span class="nav-icon">◉</span> 活动管理</div>
    <div class="nav-item" data-page="workbench"><span class="nav-icon">♻</span> 物资评估</div>
    <div class="nav-item" data-page="claims"><span class="nav-icon">▧</span> 申领管理</div>
    <div class="nav-item" data-page="orders"><span class="nav-icon">▥</span> 订单管理</div>
    <div class="nav-group">系统</div>
    <div class="nav-item" data-page="configs"><span class="nav-icon">⚙</span> 规则配置</div>
    <div class="nav-item" data-page="audit"><span class="nav-icon">◈</span> AI 审计</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topTitle">数据看板 <span style="font-size:11px;color:#9ca3af;font-weight:400;margin-left:10px" title="确认是否加载到最新版页面">v2·含地址</span></div>
      <div class="topbar-right">
        <div class="user-badge">
          <div class="avatar" id="userAvatar">管</div>
          <span id="userName">管理员</span>
          <span class="role-tag" id="userRole">ADMIN</span>
        </div>
        <button class="logout-btn" onclick="doLogout()">退出登录</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-title" id="modalTitle">操作</div>
    <div id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modalOk" onclick="confirmModal()">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==================== 基础配置 ==================== */
// context-path 为 /api，所有接口走此前缀
var API = '/api';
var TOKEN_KEY = 'greenyi_admin_token';
var USER_KEY  = 'greenyi_admin_user';
var token = localStorage.getItem(TOKEN_KEY) || '';
var currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem(USER_KEY) || 'null'); } catch (e) { currentUser = null; }
var currentPage = 'dashboard';
var modalAction = null;

/* ==================== 工具函数 ==================== */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function showToast(msg, ok) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(function () { t.className = 'toast'; }, 3000);
}
function goLogin() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
  token = '';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('mainView').style.display = 'none';
}

/* ==================== 请求封装 ==================== */
function api(path, opts) {
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if (token) headers['X-Token'] = token;
  return fetch(API + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function (r) {
    return r.json().catch(function () { throw new Error('服务器返回非 JSON（HTTP ' + r.status + '）'); });
  }).then(function (j) {
    if (j.code === 0) return j.data;
    if (j.code === 401) { goLogin(); throw new Error('登录已过期，请重新登录'); }
    throw new Error(j.message || '请求失败');
  });
}

/* ==================== 图片上传 ==================== */
/** 完整图片地址：后端返回 /uploads/... 相对路径，这里拼上 /api；兼容旧的绝对 URL */
function imgSrc(u) {
  if (!u) return '';
  u = String(u);
  if (/^https?:\/\//i.test(u) || u.indexOf('data:') === 0) return u;
  if (u.charAt(0) === '/') return API + u;
  return API + '/' + u;
}
/** 单文件上传，resolve 返回 /uploads/... 相对 URL */
function uploadImage(file) {
  var fd = new FormData();
  fd.append('file', file);
  return fetch(API + '/upload/image', {
    method: 'POST', headers: token ? { 'X-Token': token } : {}, body: fd
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j.code === 0) return j.data.url;
    throw new Error(j.message || '上传失败');
  });
}
/** 渲染一个上传控件：hidden input 存 URL（多张用英文逗号分隔），预览缩略图 */
function uploadFieldHtml(id, value, multiple) {
  var urls = value ? String(value).split(/[,，\n]/).map(function (s) { return s.trim(); }).filter(Boolean) : [];
  var html = '<div class="upload-field">'
    + '<input type="hidden" id="' + id + '" value="' + esc(urls.join(',')) + '">'
    + '<div class="upload-thumbs" id="' + id + '_thumbs"></div>'
    + '<label class="btn btn-primary upload-btn">＋ ' + (multiple ? '上传图片（可多张）' : '上传图片')
    + '<input type="file" accept="image/*" ' + (multiple ? 'multiple ' : '') + 'style="display:none"'
    + ' onchange="onUploadChange(this,\'' + id + '\',' + (multiple ? 'true' : 'false') + ')"></label>'
    + '</div>';
  window._uploadUrls = window._uploadUrls || {};
  window._uploadUrls[id] = urls;
  return html;
}
function onUploadChange(input, id, multiple) {
  var files = Array.prototype.slice.call(input.files || []);
  if (!files.length) return;
  var chain = Promise.resolve([]);
  files.forEach(function (f) {
    chain = chain.then(function (acc) {
      return uploadImage(f).then(function (url) { return acc.concat([url]); });
    });
  });
  chain.then(function (urls) {
    var cur = window._uploadUrls[id] || [];
    cur = multiple ? cur.concat(urls) : urls;
    window._uploadUrls[id] = cur;
    document.getElementById(id).value = cur.join(',');
    renderThumbs(id);
    showToast('图片已上传', true);
    input.value = '';
  }).catch(function (e) { showToast(e.message || '上传失败', false); input.value = ''; });
}
function removeUpload(id, index) {
  var cur = window._uploadUrls[id] || [];
  cur.splice(index, 1);
  window._uploadUrls[id] = cur;
  document.getElementById(id).value = cur.join(',');
  renderThumbs(id);
}
function renderThumbs(id) {
  var box = document.getElementById(id + '_thumbs');
  if (!box) return;
  var urls = window._uploadUrls[id] || [];
  box.innerHTML = urls.map(function (u, i) {
    return '<div class="upload-thumb"><img src="' + esc(imgSrc(u)) + '" alt="预览">'
      + '<span class="upload-remove" onclick="removeUpload(\'' + id + '\',' + i + ')">×</span></div>';
  }).join('');
}
/** 详情描述里插入图片：上传后把 <img> 标签追加到 textarea */
function insertDescImage(input, textareaId) {
  var f = input.files && input.files[0];
  if (!f) return;
  uploadImage(f).then(function (url) {
    var ta = document.getElementById(textareaId);
    var tag = '<img src="' + esc(url) + '" style="max-width:100%">';
    ta.value = ta.value ? ta.value + '\n' + tag : tag;
    showToast('图片已插入详情', true);
    input.value = '';
  }).catch(function (e) { showToast(e.message || '上传失败', false); input.value = ''; });
}

/* ==================== 登录 ==================== */
function doLogin() {
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value;
  var err = document.getElementById('loginErr');
  var btn = document.getElementById('loginBtn');
  if (!u || !p) { err.textContent = '请输入用户名和密码'; return; }
  err.textContent = '';
  btn.disabled = true; btn.textContent = '登录中...';
  fetch(API + '/auth/admin-login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p })
  }).then(function (r) { return r.json(); }).then(function (j) {
    btn.disabled = false; btn.textContent = '登 录';
    if (j.code !== 0) { err.textContent = j.message || '登录失败'; return; }
    token = j.data.token;
    currentUser = j.data;
    localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem(USER_KEY, JSON.stringify(j.data));
    enterMain();
    showToast('登录成功，欢迎 ' + (j.data.realName || j.data.username), true);
  }).catch(function (e) {
    btn.disabled = false; btn.textContent = '登 录';
    err.textContent = '网络错误：' + e.message;
  });
}
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

function enterMain() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  document.getElementById('userName').textContent = currentUser.realName || currentUser.username || '管理员';
  document.getElementById('userRole').textContent = currentUser.role || 'ADMIN';
  document.getElementById('userAvatar').textContent = (currentUser.realName || currentUser.username || '管').charAt(0);
  loadPage(currentPage);
}
function doLogout() { goLogin(); showToast('已退出登录', true); }

/* ==================== 导航 ==================== */
var PAGE_TITLES = {
  dashboard: '数据看板', contents: '内容管理', products: '商品管理', activities: '活动管理',
  workbench: '物资评估', claims: '申领管理', orders: '订单管理', configs: '规则配置', audit: 'AI 审计'
};
document.querySelectorAll('.nav-item').forEach(function (el) {
  el.addEventListener('click', function () {
    document.querySelectorAll('.nav-item').forEach(function (x) { x.classList.remove('active'); });
    el.classList.add('active');
    currentPage = el.getAttribute('data-page');
    document.getElementById('topTitle').textContent = PAGE_TITLES[currentPage];
    loadPage(currentPage);
  });
});
function loadPage(p) {
  var c = document.getElementById('content');
  c.innerHTML = '<div class="loading">加载中...</div>';
  var fn = {
    dashboard: renderDashboard, contents: renderContents, products: renderProducts,
    activities: renderActivities, workbench: renderWorkbench, claims: renderClaims,
    orders: renderOrders, configs: renderConfigs, audit: renderAudit
  }[p];
  if (fn) fn(c);
}

/* ==================== 数据看板 ==================== */
function renderDashboard(c) {
  api('/admin/dashboard').then(function (d) {
    var cards = [
      ['公益商品', d.products, '在售商品数'],
      ['宣传内容', d.contents, '已发布内容'],
      ['公益活动', d.activities, '活动总数'],
      ['待评估捐赠', d.pendingAssessment, '物资评估工作台'],
      ['免费申领', d.claims, '申领记录数'],
      ['公益订单', d.orders || 0, '商品销售订单']
    ];
    var html = '<div class="page-head"><div><div class="page-title">数据看板</div><div class="page-desc">运营概览 · ' + esc(d.note || '') + '</div></div></div>';

/* ==================== 物资评估工作台 ==================== */
var workbenchFilter = 'ALL';
function renderWorkbench(c) {
  api('/admin/workbench?current=1&size=50&status=' + encodeURIComponent(workbenchFilter)).then(function (d) {
    var rows = (d.records || []).map(function (x) {
      var ops = '-';
      if (x.status === 'PENDING_RECEIVE') ops = '<button class="btn btn-primary" onclick="receiveDonation(' + x.id + ')">签收</button>';
      else if (x.status === 'RECEIVED' || x.status === 'REVIEWING') ops = '<button class="btn btn-primary" onclick="assessDonation(' + x.id + ')">评估计价</button>';
      return '<tr><td>' + esc(x.id) + '</td><td>' + esc(x.donationNo || '-') + '</td><td>' + esc(x.userId) + '</td>'
        + '<td>' + esc(x.description || '-') + '</td><td>' + donationStatusTag(x.status) + '</td>'
        + '<td>' + ops + '</td></tr>';
    }).join('');
    var opts = [['ALL','全部'],['PENDING_RECEIVE','待接收'],['RECEIVED','已接收'],['REVIEWING','复核中'],['ASSESSED','已评估'],['BOOKED','已入账'],['CLOSED','已关闭']]
      .map(function (o) { return '<option value="' + o[0] + '"' + (workbenchFilter === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('');
    var filterBar = '<div class="panel" style="padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center">'
      + '<span style="color:#6b7280">捐赠状态</span>'
      + '<select id="workbenchFilter" class="form-input" style="width:150px;height:34px;padding:0 8px" onchange="changeWorkbenchFilter()">' + opts + '</select>'
      + '<button class="btn" onclick="loadPage(\'workbench\')">刷新</button></div>';
    c.innerHTML = pageHead('物资评估工作台', '用户提交 → 评估员签收 → 评估计价 → 发放积分/等级证书')
      + filterBar
      + tablePanel(['ID','捐赠单号','用户','物资描述','状态','操作'], rows, (d.records || []).length, '暂无捐赠记录');
  }).catch(function (e) { c.innerHTML = errPanel(e); });
}
function changeWorkbenchFilter() { workbenchFilter = document.getElementById('workbenchFilter').value; loadPage('workbench'); }
function donationStatusTag(s) {
  var m = { 'PENDING_RECEIVE':'待接收','RECEIVED':'已接收','REVIEWING':'复核中','ASSESSED':'已评估','BOOKED':'已入账','CLOSED':'已关闭' };
  var cls = s === 'PENDING_RECEIVE' ? 'tag-amber' : s === 'RECEIVED' ? 'tag-amber' : s === 'REVIEWING' ? 'tag-blue' : (s === 'ASSESSED' || s === 'BOOKED') ? 'tag-green' : '';
  return '<span class="tag ' + cls + '">' + esc(m[s] || s) + '</span>';
}
function claimStatusTag(s) {
  var m = { 'PENDING_PAY':'待付运费','PAID':'待发货','SHIPPED':'已发货','COMPLETED':'已完成','CLOSED':'已关闭' };
  var cls = s === 'PENDING_PAY' ? 'tag-amber' : s === 'PAID' ? 'tag-amber' : s === 'SHIPPED' ? 'tag-blue' : s === 'COMPLETED' ? 'tag-green' : '';
  return '<span class="tag ' + cls + '">' + esc(m[s] || s) + '</span>';
}
function receiveDonation(id) {
  confirmBox('签收捐赠', '确认已收到该物资？签收后即可评估计价。', function () {
    api('/admin/donation/' + id + '/receive', { method: 'POST', body: {} }).then(function () {
      showToast('签收成功', true); loadPage('workbench');
    }).catch(function (e) { showToast(e.message, false); });
  });
}
function assessDonation(id) {
  showModal('评估物资 #' + id,
    '<label class="form-label">公益评估值（元）</label><input id="mValue" class="form-input" type="number" step="0.01" value="10">'
    + '<label class="form-label">评估备注</label><input id="mNote" class="form-input" placeholder="如：旧衣 3 件，成色良好">',
    function () {
      var v = document.getElementById('mValue').value;
      var n = document.getElementById('mNote').value;
      if (!v || Number(v) < 0) { showToast('请输入有效评估值', false); return; }
      api('/admin/donation/' + id + '/assess', { method: 'POST', body: { valueAmount: Number(v), note: n } }).then(function (r) {
        showToast('评估完成' + (r && r.certNo ? '，已发放等级证书' : '') + '，积分已入账', true);
        closeModal(); loadPage('workbench');
      }).catch(function (e) { showToast(e.message, false); });
    });
}

  }).catch(function (e) { c.innerHTML = errPanel(e); });
}
function viewClaimDetail(id) {
  api('/admin/claims').then(function (d) {
    var x = (d || []).filter(function (it) { return it.id === id; })[0];
    if (!x) { showToast('未找到该申领记录', false); return; }
    var a = x.address || {};
    var addrHtml = x.address
      ? '<div style="background:#f8fafc;border-radius:8px;padding:12px 14px;line-height:1.9">'
        + '<div><b>收货人：</b>' + esc(a.receiver) + '　<b>电话：</b>' + esc(a.phone) + '</div>'
        + '<div>' + esc(a.fullAddress) + '</div></div>'
      : '<div style="color:#9ca3af;padding:12px 0">该申领未绑定收货地址</div>';
    var html = '<div style="line-height:1.9">'
      + '<div class="between"><span>申领单号：<b>' + esc(x.claimNo) + '</b></span>' + claimStatusTag(x.status) + '</div>'
      + '<div>申领人：' + esc(x.userName || x.userId) + '（用户 ID ' + esc(x.userId) + '）</div>'
      + '<div>申领商品：' + esc(x.productName || x.productId) + '　运费：¥' + esc(x.freightAmount) + '</div>'
      + '<div>试算地区：' + esc(x.region || '-') + '　重量：' + esc(x.weightGram || 0) + ' 克</div>'
      + '<div>支付状态：' + esc(x.payStatus) + '　物流单号：' + esc(x.logisticsNo || '未发货') + '</div>'
      + '<div style="margin-top:12px"><b>收货地址</b></div>' + addrHtml
      + '</div>';
    showModal('申领详情 ' + x.claimNo, html, null);
    document.getElementById('modalOk').style.display = 'none';
  }).catch(function (e) { showToast(e.message, false); });
}
function shipClaim(id) {
  promptBox('申领发货', '物流单号：', '', function (v) {
    api('/admin/claim/' + id + '/ship', { method: 'POST', body: { logisticsNo: v } }).then(function () {
      showToast('发货成功', true); closeModal(); loadPage('claims');
    }).catch(function (e) { showToast(e.message, false); });
  });
}

/* ==================== 订单管理与物流跟踪 ==================== */
var orderFilter = 'ALL';
function renderOrders(c) {
  api('/admin/orders?status=' + encodeURIComponent(orderFilter)).then(function (d) {
    var arr = d || [];
    var paid = 0, shipped = 0, soldQty = 0, soldAmount = 0;
    arr.forEach(function (x) {
      if (x.status === 'PAID') paid++;
      if (x.status === 'SHIPPED') shipped++;
      if (x.payStatus === 'PAID' || x.payStatus === 'REFUNDED') {
        (x.items || []).forEach(function (it) { soldQty += Number(it.quantity || 0); });
      }
      if (x.payStatus === 'PAID') soldAmount += Number(x.payAmount || 0);
    });
    var stats = '<div class="stat-grid">'
      + statCard('订单总数', arr.length, '全部商品订单')
      + statCard('待发货', paid, '买家已付款')
      + statCard('已发货', shipped, '物流跟踪中')
      + statCard('已售商品件数', soldQty, '按订单明细统计')
      + statCard('已售金额', '¥' + soldAmount.toFixed(2), '已支付订单实付合计')
      + '</div>';
    var opts = [['ALL','全部状态'],['PENDING_PAY','待支付'],['PAID','待发货'],['SHIPPED','已发货'],['RETURN_APPLYING','退货中'],['COMPLETED','已完成'],['REFUNDED','已退款']]
      .map(function (o) { return '<option value="' + o[0] + '"' + (orderFilter === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('');
    var filterBar = '<div class="panel" style="padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center">'
      + '<span style="color:#6b7280">订单状态</span>'
      + '<select id="orderFilter" class="form-input" style="width:140px;height:34px;padding:0 8px" onchange="changeOrderFilter()">' + opts + '</select>'
      + '<button class="btn" onclick="loadPage(\'orders\')">刷新</button></div>';
    var rows = arr.map(function (x) {
      var ops = '<button class="btn btn-primary" onclick="viewOrderDetail(' + x.id + ')">详情</button>';
      if (x.status === 'PAID') ops += ' <button class="btn" onclick="shipOrder(' + x.id + ')">发货</button>';
      else if (x.status === 'SHIPPED') ops += ' <button class="btn" onclick="completeOrder(' + x.id + ')">标记完成</button>';
      else if (x.status === 'RETURN_APPLYING') ops += ' <button class="btn btn-danger" onclick="approveReturn(' + x.id + ')">同意退货</button> <button class="btn" onclick="rejectReturn(' + x.id + ')">拒绝</button>';
      return '<tr><td>' + esc(x.orderNo) + '</td><td>' + esc(x.userName || x.userId) + '</td>'
        + '<td>' + esc(x.itemSummary || '-') + '</td>'
        + '<td>' + addrBrief(x.address) + '</td>'
        + '<td>¥' + esc(x.payAmount) + '</td>'
        + '<td>' + payTag(x.payStatus) + '</td><td>' + orderStatusTag(x.status) + '</td>'
        + '<td>' + esc(x.logisticsNo || '-') + '</td><td>' + ops + '</td></tr>';
    }).join('');
    c.innerHTML = pageHead('订单管理', '已卖出的商品、收货地址与物流状态跟踪')
      + stats + filterBar
      + tablePanel(['订单号','购买人','已售商品','收货地址','实付','支付状态','订单状态','物流单号','操作'], rows, arr.length, '暂无订单');
  }).catch(function (e) { c.innerHTML = errPanel(e); });
}
function statCard(label, value, note) {
  return '<div class="stat-card"><div class="stat-label">' + esc(label) + '</div><div class="stat-value">' + esc(value) + '</div><div class="stat-note">' + esc(note) + '</div></div>';
}
function changeOrderFilter() { orderFilter = document.getElementById('orderFilter').value; loadPage('orders'); }
function payTag(s) {
  var cls = s === 'PAID' ? 'tag-green' : s === 'REFUNDED' ? 'tag-red' : 'tag-amber';
  var txt = s === 'PAID' ? '已支付' : s === 'REFUNDED' ? '已退款' : '待支付';
  return '<span class="tag ' + cls + '">' + esc(txt) + '</span>';
}
function orderStatusTag(s) {
  var m = { PENDING_PAY:'待支付', PAID:'待发货', SHIPPED:'已发货', RETURN_APPLYING:'退货中', COMPLETED:'已完成', REFUNDED:'已退款' };
  var cls = s === 'PAID' ? 'tag-amber' : s === 'SHIPPED' ? 'tag-blue' : s === 'COMPLETED' ? 'tag-green' : (s === 'REFUNDED' || s === 'RETURN_APPLYING') ? 'tag-red' : '';
  return '<span class="tag ' + cls + '">' + esc(m[s] || s) + '</span>';
}
function viewOrderDetail(id) {
  api('/admin/order/' + id).then(function (o) {
    var a = o.address || {};
    var addrHtml = o.address
      ? '<div style="background:#f8fafc;border-radius:8px;padding:12px 14px;line-height:1.9">'
        + '<div><b>收货人：</b>' + esc(a.receiver) + '　<b>电话：</b>' + esc(a.phone) + '</div>'
        + '<div>' + esc(a.fullAddress) + '</div></div>'
      : '<div style="color:#9ca3af;padding:12px 0">该订单未绑定收货地址</div>';
    var itemRows = (o.items || []).map(function (it) {
      return '<tr><td>' + esc(it.name) + '</td><td>¥' + esc(it.price) + '</td><td>' + esc(it.quantity)
        + '</td><td>¥' + esc((Number(it.price || 0) * Number(it.quantity || 0)).toFixed(2)) + '</td></tr>';
    }).join('');
    var html = '<div style="line-height:1.9">'
      + '<div class="between"><span>订单号：<b>' + esc(o.orderNo) + '</b></span>' + orderStatusTag(o.status) + '</div>'
      + '<div>下单时间：' + esc(o.createdAt) + '　支付状态：' + esc(o.payStatus) + '</div>'
      + '<div>买家：' + esc(o.userName || o.userId) + '（用户 ID ' + esc(o.userId) + '）</div>'
      + '<div style="margin-top:12px"><b>收货地址</b></div>' + addrHtml
      + '<div style="margin-top:12px"><b>商品明细</b></div>'
      + '<table style="margin-top:6px"><thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr></thead><tbody>'
      + (itemRows || '<tr><td colspan="4" style="text-align:center;color:#9ca3af">无商品明细</td></tr>') + '</tbody></table>'
      + '<div style="margin-top:12px"><b>费用</b>：商品 ¥' + esc(o.goodsAmount) + '　运费 ¥' + esc(o.freightAmount)
      + '　积分抵扣 ¥' + esc(o.discountAmount) + '　<b>实付 ¥' + esc(o.payAmount) + '</b></div>'
      + '<div>物流单号：' + esc(o.logisticsNo || '未发货') + '</div>'
      + '<div>使用积分：' + esc(o.pointsUsed || 0) + '　支付流水：' + esc(o.transactionId || '-') + '</div>'
      + '</div>';
    showModal('订单详情 ' + o.orderNo, html, null);
    document.getElementById('modalOk').style.display = 'none';
  }).catch(function (e) { showToast(e.message, false); });
}
function approveReturn(id) {
  confirmBox('同意退货', '同意后将退款并回退库存与积分，确定继续？', function () {
    api('/admin/order/' + id + '/return-approve', { method: 'POST' }).then(function () {
      showToast('退货完成，款项与积分已回退', true); closeModal(); loadPage('orders');
    }).catch(function (e) { showToast(e.message, false); });
  });
}
function rejectReturn(id) {
  confirmBox('拒绝退货', '拒绝后订单恢复为已发货状态，确定继续？', function () {
    api('/admin/order/' + id + '/return-reject', { method: 'POST' }).then(function () {
      showToast('已拒绝退货申请', true); closeModal(); loadPage('orders');
    }).catch(function (e) { showToast(e.message, false); });
  });
}
function shipOrder(id) {
  promptBox('商品发货', '物流单号（可留空）：', '', function (v) {
    api('/admin/order/' + id + '/ship', { method: 'POST', body: { logisticsNo: v } }).then(function () {
      showToast('已发货', true); closeModal(); loadPage('orders');
    }).catch(function (e) { showToast(e.message, false); });
  });
}
function completeOrder(id) {
  confirmBox('完成订单', '确认订单 #' + id + ' 已完成？', function () {
    api('/admin/order/' + id + '/complete', { method: 'POST' }).then(function () {
      showToast('订单已完成', true); closeModal(); loadPage('orders');
    }).catch(function (e) { showToast(e.message, false); });
  });
}

/* ==================== 规则配置 ==================== */
function renderConfigs(c) {
  api('/admin/configs').then(function (d) {
    var arr = d || [];
    var rows = arr.map(function (x) {
      return '<tr><td>' + esc(x.configKey) + '</td><td>' + esc(x.configValue) + '</td><td>' + esc(x.description || '-') + '</td>'
        + '<td><button class="btn" onclick="editConfig(\'' + esc(x.configKey) + '\',\'' + esc(x.configValue) + '\')">编辑</button></td></tr>';
    }).join('');
    c.innerHTML = pageHead('规则配置', '证书等级阈值、积分换算、抵扣上限等业务规则（草案值）')
      + tablePanel(['配置项','当前值','说明','操作'], rows, arr.length, '暂无配置项');
  }).catch(function (e) { c.innerHTML = errPanel(e); });
}
function editConfig(key, val) {
  showModal('编辑配置 ' + key,
    '<label class="form-label">配置值</label><input id="mVal" class="form-input" value="' + esc(val) + '">',
    function () {
      api('/admin/config', { method: 'POST', body: { configKey: key, configValue: document.getElementById('mVal').value } }).then(function () {
        showToast('已保存', true); closeModal(); loadPage('configs');
      }).catch(function (e) { showToast(e.message, false); });
    });
}

/* ==================== AI 审计 ==================== */
function renderAudit(c) {
  api('/admin/ai-audit?current=1&size=50').then(function (d) {
    var rows = (d.records || []).map(function (x) {
      return '<tr><td>' + esc(x.id) + '</td><td>' + esc(x.feature) + '</td><td>' + esc(x.userId || '-') + '</td>'
        + '<td>' + esc(x.createdAt) + '</td><td><button class="btn" onclick="viewAudit(' + x.id + ')">详情</button></td></tr>';
    }).join('');
    c.innerHTML = pageHead('AI 审计', '所有 AI 调用（推荐/客服/文案/估值参考）均留痕，可人工复核')
      + tablePanel(['ID','功能','用户','时间','操作'], rows, (d.records || []).length, '暂无 AI 调用记录');
  }).catch(function (e) { c.innerHTML = errPanel(e); });
}
function viewAudit(id) {
  api('/admin/ai-audit?current=1&size=50').then(function (d) {
    var hit = (d.records || []).filter(function (x) { return x.id === id; })[0];
    openJsonModal('AI 审计记录 #' + id, hit || {});
  }).catch(function (e) { showToast(e.message, false); });
}

/* ==================== 通用 UI 组件 ==================== */
function pageHead(title, desc) {
  return '<div class="page-head"><div><div class="page-title">' + esc(title) + '</div><div class="page-desc">' + esc(desc) + '</div></div></div>';
}
function tablePanel(headers, rows, count, emptyText) {
  var h = '<div class="panel"><table><thead><tr>';
  headers.forEach(function (x) { h += '<th>' + esc(x) + '</th>'; });
  h += '</tr></thead><tbody>';
  h += rows || ('<tr><td colspan="' + headers.length + '"><div class="empty"><div class="empty-icon">▤</div>' + esc(emptyText) + '</div></td></tr>');
  h += '</tbody></table><div class="pager">共 ' + esc(count) + ' 条记录</div></div>';
  return h;
}
function errPanel(e) { return '<div class="empty">加载失败：' + esc(e.message) + '</div>'; }

function showModal(title, bodyHtml, onOk) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  modalAction = onOk;
  document.getElementById('modalMask').style.display = 'flex';
}
function confirmBox(title, msg, onOk) { showModal(title, '<div style="color:#4b5563;line-height:1.7">' + esc(msg) + '</div>', onOk); }
function promptBox(title, label, def, onOk) {
  showModal(title, '<label class="form-label">' + esc(label) + '</label><input id="mInput" class="form-input" value="' + esc(def) + '">', function () {
    onOk(document.getElementById('mInput').value.trim());
  });
}
function openJsonModal(title, obj) {
  showModal(title, '<div class="json-pre">' + esc(JSON.stringify(obj, null, 2)) + '</div>', null);
  document.getElementById('modalOk').style.display = 'none';
}
function closeModal() {
  document.getElementById('modalMask').style.display = 'none';
  modalAction = null;
  document.getElementById('modalOk').style.display = '';
}
function confirmModal() { if (modalAction) modalAction(); }

/* ==================== 启动 ==================== */
if (token && currentUser) { enterMain(); }
else { goLogin(); }
</script>
